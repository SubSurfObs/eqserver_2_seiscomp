# Station Registry
# Authoritative per-station mapping for the EqServer → SDS conversion pipeline.
#
# Fields:
#   include:           true | false | unknown
#   reason:            (if include: false) why excluded
#   target_network:    VW | VX | DU | null
#   network_basis:     registry | passthrough | heuristic | notes | unknown
#                        registry   = explicit in FDSN StationXML for that network
#                        passthrough= source MiniSEED already carries DU code
#                        heuristic  = inferred from naming pattern (numbered suffix etc.)
#                        notes      = inferred from field notes / secondary sources
#                        unknown    = not yet determined
#   source_network_code: network code in source MiniSEED files; null for EchoPro/SUDS
#   recorder_types:    list of recorder types (echopro | gecko | guralp | reftek | piesmo)
#                      ordered chronologically if changed; null = not yet confirmed
#   coverage_start:    approximate first year (from archive scan; 1900/1970 = bogus artifact)
#   coverage_end:      approximate last year
#   notes:             free text
#
# Sources used to build this file (2026-04-12):
#   metadata/uploaded/VW/vw.xml              (FDSN StationXML, VW network)
#   metadata/uploaded/VX/vx.xml              (FDSN StationXML, VX network)
#   metadata/uploaded/DU/du.xml              (FDSN StationXML, DU network)
#   metadata/uploaded/AU_S1/au.xml           (FDSN StationXML, AU/GA network — exclude)
#   metadata/uploaded/AU_S1/s1.xml           (FDSN StationXML, S1/AUSiS network — exclude)
#   metadata/uploaded/VW/Metadata/Januka_XMLS/   (individual UM/AB station XMLs → VW)
#   metadata/uploaded/VW/Metadata/LatestXMLS_2021/
#   metadata/uploaded/VX/WoodsPoint.md
#   metadata/uploaded/VX/Apollo Bay Eq.md
#   Archive directory scan (2026-04-12): 251 station directories

